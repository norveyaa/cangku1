<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 伴读智汇</title>
<link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
<div class="auth-body">
  <!-- 品牌侧栏 -->
  <aside class="auth-side">
    <div class="flex items-center gap-12">
      <span style="width:44px;height:44px;border-radius:10px;background:rgba(241,180,100,.9);display:flex;align-items:center;justify-content:center;color:#4A3520" id="side-logo"></span>
      <div>
        <div style="font-family:var(--serif);font-size:22px;font-weight:700;color:#F2EDE3">伴读智汇</div>
        <div style="font-size:11px;color:rgba(242,237,227,.6);letter-spacing:.1em">让每一页，都读得更深一点</div>
      </div>
    </div>
    <div class="as-quote">从"读完"走向<br><span class="hl">读懂 · 读深 · 读思</span><br>整本书阅读的智能陪练平台</div>
    <div class="as-foot">面向 K12 与高校语文整本书阅读 · 记录学习行为数据 · 动态规划阅读节奏</div>
  </aside>

  <!-- 登录区 -->
  <main class="auth-main">
    <div class="auth-card">
      <h1 class="auth-title">欢迎回来</h1>
      <p class="auth-sub">登录后继续你的阅读计划</p>

      <div class="tabs" id="login-tabs" style="margin-bottom:22px">
        <button class="tab active" data-tab="code">验证码登录</button>
        <button class="tab" data-tab="pass">密码登录</button>
        <button class="tab" data-tab="invite">邀请码登录</button>
      </div>

      <!-- 验证码登录 -->
      <form id="f-code" onsubmit="return UI.doCodeLogin(event)">
        <div class="field">
          <label>手机号</label>
          <input class="input" id="code-phone" placeholder="请输入手机号" maxlength="11" inputmode="numeric">
          <div class="field-err">请输入 11 位手机号</div>
        </div>
        <div class="field">
          <label>验证码</label>
          <div class="sms-row">
            <input class="input" id="code-val" placeholder="4 位验证码" maxlength="4" inputmode="numeric">
            <button type="button" class="btn btn-outline" id="code-btn" onclick="UI.sendCode()">获取验证码</button>
          </div>
          <div class="hint">演示环境：任意 4 位数字均可通过</div>
        </div>
        <label class="check-row" style="margin:8px 0 20px">
          <input type="checkbox" checked> 我已阅读并同意《用户协议》与《隐私政策》
        </label>
        <button class="btn btn-primary btn-lg btn-block" type="submit">登录</button>
      </form>

      <!-- 密码登录 -->
      <form id="f-pass" class="hide" onsubmit="return UI.doPassLogin(event)">
        <div class="field">
          <label>手机号</label>
          <input class="input" id="pass-phone" placeholder="请输入手机号" maxlength="11" inputmode="numeric">
        </div>
        <div class="field">
          <label>密码</label>
          <input class="input" id="pass-val" type="password" placeholder="请输入密码">
        </div>
        <label class="check-row" style="margin:8px 0 20px">
          <input type="checkbox" checked> 我已阅读并同意《用户协议》与《隐私政策》
        </label>
        <button class="btn btn-primary btn-lg btn-block" type="submit">登录</button>
      </form>

      <!-- 邀请码登录 -->
      <form id="f-invite" class="hide" onsubmit="return UI.doInviteLogin(event)">
        <div class="field">
          <label>班级邀请码</label>
          <input class="input" id="invite-val" placeholder="请输入教师发放的班级邀请码">
          <div class="hint">适用于教师布置班级阅读场景，登录后自动加入班级课程</div>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">加入班级</button>
      </form>

      <!-- 演示账号 -->
      <div class="demo-box">
        <b>演示账号（密码登录）</b>
        <div class="flex justify-between items-center mt-8">
          <span>学生端：13800000001 / 123456</span>
          <a href="javascript:void(0)" onclick="UI.fillDemo(0)">填入</a>
        </div>
        <div class="flex justify-between items-center mt-8">
          <span>教师端：13800000002 / 123456</span>
          <a href="javascript:void(0)" onclick="UI.fillDemo(1)">填入</a>
        </div>
        <div class="flex justify-between items-center mt-8">
          <span>班级邀请码：Q3-2026</span>
          <a href="javascript:void(0)" onclick="UI.fillInvite()">填入</a>
        </div>
      </div>

      <p class="auth-foot">还没有账号？<a href="register.html">立即注册</a></p>
    </div>
    <p class="auth-foot" style="font-size:11.5px;color:var(--muted);opacity:.7">未成年人请在监护人指导下使用 · 本产品为前端原型演示</p>
  </main>
</div>

<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function () {
  // 已登录 → 按角色分发（PRD 8 跳转规则）
  var u = Store.user();
  if (u) { go(u.role); return; }
  var params = new URLSearchParams(location.search);
  var redirect = params.get('redirect');

  function go(role) {
    var target = redirect || (role === 'teacher' ? 'teacher/dashboard.html' : 'student/home.html');
    location.replace(target);
  }

  // 选项卡切换
  document.querySelectorAll('#login-tabs .tab').forEach(function (t) {
    t.onclick = function () {
      document.querySelectorAll('#login-tabs .tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      ['code', 'pass', 'invite'].forEach(function (k) {
        document.getElementById('f-' + k).classList.toggle('hide', t.dataset.tab !== k);
      });
    };
  });

  // 侧栏 logo
  document.getElementById('side-logo').innerHTML = UI.icon('book', 22);

  var timer = null;
  window.UI = Object.assign(window.UI || {}, {
    sendCode: function () {
      var phone = document.getElementById('code-phone').value;
      if (!/^1\d{10}$/.test(phone)) {
        UI.toast('请输入正确的 11 位手机号', 'warning');
        return;
      }
      var btn = document.getElementById('code-btn');
      var s = 60;
      btn.disabled = true;
      UI.toast('验证码已发送（演示：任意 4 位数字）', 'success');
      timer = setInterval(function () {
        s--;
        btn.textContent = s + 's 后重发';
        if (s <= 0) { clearInterval(timer); btn.disabled = false; btn.textContent = '获取验证码'; }
      }, 1000);
    },
    doCodeLogin: function (e) {
      e.preventDefault();
      var phone = document.getElementById('code-phone').value;
      var code = document.getElementById('code-val').value;
      if (!/^1\d{10}$/.test(phone)) { UI.toast('请输入正确的 11 位手机号', 'warning'); return false; }
      if (code.length !== 4) { UI.toast('请输入 4 位验证码', 'warning'); return false; }
      var r = Store.loginByCode(phone);
      if (!r.ok) { UI.toast(r.msg, 'error'); return false; }
      UI.toast('登录成功', 'success');
      setTimeout(function () { go(r.role); }, 400);
      return false;
    },
    doPassLogin: function (e) {
      e.preventDefault();
      var phone = document.getElementById('pass-phone').value;
      var pass = document.getElementById('pass-val').value;
      if (!/^1\d{10}$/.test(phone)) { UI.toast('请输入正确的 11 位手机号', 'warning'); return false; }
      if (!pass) { UI.toast('请输入密码', 'warning'); return false; }
      var r = Store.login(phone, pass);
      if (!r.ok) { UI.toast(r.msg, 'error'); return false; }
      UI.toast('登录成功', 'success');
      setTimeout(function () { go(r.role); }, 400);
      return false;
    },
    doInviteLogin: function (e) {
      e.preventDefault();
      var code = document.getElementById('invite-val').value.trim();
      if (!code) { UI.toast('请输入班级邀请码', 'warning'); return false; }
      var r = Store.loginByInvite(code);
      if (!r.ok) { UI.toast(r.msg, 'error'); return false; }
      UI.toast('已加入班级，欢迎！', 'success');
      setTimeout(function () { go(r.role); }, 400);
      return false;
    },
    fillDemo: function (i) {
      document.querySelectorAll('#login-tabs .tab')[1].click();
      document.getElementById('pass-phone').value = i === 0 ? '13800000001' : '13800000002';
      document.getElementById('pass-val').value = '123456';
    },
    fillInvite: function () {
      document.querySelectorAll('#login-tabs .tab')[2].click();
      document.getElementById('invite-val').value = 'Q3-2026';
    }
  });
})();
</script>
</body>
</html>
