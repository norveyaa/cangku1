<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>布置任务 · 伴读智汇</title>
<link rel="stylesheet" href="../assets/css/base.css">
</head>
<body>
<div class="page" style="max-width:820px">
  <div id="head"></div>
  <div class="card card-pad">
    <div class="field">
      <label>任务类型</label>
      <div class="chip-group" id="type-chips">
        <button type="button" class="chip selected" data-v="导读">导读任务</button>
        <button type="button" class="chip" data-v="章节测">章节测</button>
        <button type="button" class="chip" data-v="思辨题">思辨题</button>
        <button type="button" class="chip" data-v="读后感">读后感</button>
      </div>
    </div>
    <div class="field">
      <label>书目</label>
      <select class="select" id="t-book"></select>
    </div>
    <div class="field">
      <label>章节范围</label>
      <div class="input-group">
        <select class="select" id="t-from"></select>
        <span class="text-muted" style="align-self:center">至</span>
        <select class="select" id="t-to"></select>
      </div>
    </div>
    <div class="field">
      <label>任务标题</label>
      <input class="input" id="t-title" placeholder="例如：《骆驼祥子》第十六至十八章 · 章节测">
    </div>
    <div class="field">
      <label>截止时间</label>
      <input class="input" id="t-deadline" type="date" value="2026-10-27">
      <div class="hint">截止前 24 小时系统将自动提醒未完成学生（PRD 4.6 干预）</div>
    </div>
    <div class="field">
      <label>附加思辨题（可选）</label>
      <div id="think-checks"></div>
    </div>
    <div class="field">
      <label>任务说明</label>
      <textarea class="textarea" id="t-desc" placeholder="给学生的任务说明，如阅读策略提示…"></textarea>
    </div>
    <div class="demo-box" style="margin-top:0">
      💡 教师端设计原则（PRD 补充建议 4）：任务要"减负"，系统自动批改章节测，教师只需评阅思辨题与读后感。
    </div>
    <div class="flex gap-12 mt-20" style="justify-content:flex-end">
      <button class="btn btn-ghost" onclick="location.href='dashboard.html'">取消</button>
      <button class="btn btn-primary btn-lg" onclick="UI.publish()">发布任务</button>
    </div>
  </div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(function () {
  if (!UI.guard('teacher')) return;
  UI.topbar('class', { base: '../' });
  document.getElementById('head').innerHTML = UI.pageHead('布置阅读任务', '选书 · 章节 · 截止时间 · 思辨题（PRD 6.2 教师核心流程）');

  var books = Store.books();
  document.getElementById('t-book').innerHTML = books.map(function (b) {
    return '<option value="' + b.id + '">' + b.title + '（' + b.author + '）</option>';
  }).join('');

  function fillChapters() {
    var id = document.getElementById('t-book').value;
    var b = Store.book(id);
    var opts = b.chapterNames.map(function (t, i) {
      return '<option value="' + i + '">' + (i + 1) + '. ' + t + '</option>';
    }).join('');
    document.getElementById('t-from').innerHTML = opts;
    document.getElementById('t-to').innerHTML = opts;
    document.getElementById('t-to').value = String(Math.min(7, b.chapterNames.length - 1));
    document.getElementById('t-title').value = '《' + b.title + '》第一至八章 · 章节测';
    // 思辨题多选
    var think = Store.thinkList(id).slice(0, 4);
    document.getElementById('think-checks').innerHTML = think.length
      ? think.map(function (t, i) {
        return '<label class="check-row" style="margin-bottom:8px"><input type="checkbox" value="' + t.id + '"' + (i === 0 ? ' checked' : '') + '>' +
          '<span>' + t.title + ' <span class="tag tag-accent" style="margin-left:6px">' + t.type + '</span></span></label>';
      }).join('')
      : '<div class="text-xs text-muted">该书目暂无思辨题，可在题库自建</div>';
  }
  document.getElementById('t-book').onchange = fillChapters;
  fillChapters();

  document.querySelectorAll('#type-chips .chip').forEach(function (c) {
    c.onclick = function () {
      document.querySelectorAll('#type-chips .chip').forEach(function (x) { x.classList.remove('selected'); });
      c.classList.add('selected');
    };
  });

  window.UI = Object.assign(window.UI || {}, {
    publish: function () {
      var type = document.querySelector('#type-chips .chip.selected').dataset.v;
      var title = document.getElementById('t-title').value.trim();
      if (!title) { UI.toast('请填写任务标题', 'warning'); return; }
      var from = +document.getElementById('t-from').value;
      var to = +document.getElementById('t-to').value;
      var b = Store.book(document.getElementById('t-book').value);
      var range = (from + 1) + '—' + (to + 1);
      Store.addTeacherTask('class-1', {
        title: title, type: type, deadline: document.getElementById('t-deadline').value.slice(5),
        total: 42
      });
      UI.toast('任务已发布到七年级（3）班，学生端将收到提醒', 'success');
      setTimeout(function () { location.href = 'class.html'; }, 800);
    }
  });
})();
</script>
</body>
</html>
