<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教师工作台 · 伴读智汇</title>
<link rel="stylesheet" href="../assets/css/base.css">
</head>
<body>
<div class="page">
  <div id="head"></div>

  <!-- 统计瓦片 -->
  <div class="stat-grid" id="stat-grid"></div>

  <div style="display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:20px" class="dash-cols">
    <div>
      <!-- 班级列表 -->
      <div class="card" id="class-card"></div>
      <!-- 待办：评阅 -->
      <div class="card mt-20" id="review-card"></div>
    </div>
    <div>
      <!-- 快捷操作 -->
      <div class="card card-pad" id="quick-card"></div>
      <!-- 消息 -->
      <div class="card card-pad mt-20" id="messages">
        <div class="card-head"><div class="card-title">消息中心</div></div>
        <div id="msg-list"></div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/charts.js"></script>
<script>
(function () {
  if (!UI.guard('teacher')) return;
  UI.topbar('dashboard', { base: '../' });
  var t = Store.teacher();
  var cls = Store.classById('class-1');

  document.getElementById('head').innerHTML = UI.pageHead(
    '工作台 · ' + t.name + '老师',
    t.school + ' · 语文 · 整本书阅读教学助手（教师端减负：不是第二个批改系统）'
  );

  /* ---------- 统计瓦片 ---------- */
  var tiles = [
    { label: '我的班级', value: '1 <small>个</small>', note: '七年级（3）班 · 42 名学生', spark: [30, 33, 35, 36, 38, 40, 42] },
    { label: '本周活跃学生', value: '31 <small>人</small>', note: '较上周 +6 人', spark: [18, 22, 20, 26, 28, 31, 31] },
    { label: '待评阅作业', value: '3 <small>份</small>', note: '2 份思辨题 · 1 份章节测', spark: [5, 4, 6, 3, 2, 3, 3] },
    { label: '任务完成率', value: '74<small>%</small>', note: '当前任务平均完成率', spark: [52, 58, 61, 66, 70, 72, 74] }
  ];
  document.getElementById('stat-grid').innerHTML = tiles.map(function (t, i) {
    return '<div class="card stat-tile">' +
      '<div class="st-label"><span>' + t.label + '</span></div>' +
      '<div class="st-value">' + t.value + '</div>' +
      '<div class="flex justify-between items-center" style="margin-top:6px">' +
      '<span class="st-note">' + t.note + '</span><span id="spark-' + i + '"></span></div></div>';
  }).join('');
  tiles.forEach(function (t, i) { Charts.spark(document.getElementById('spark-' + i), t.spark); });

  /* ---------- 班级列表 ---------- */
  document.getElementById('class-card').innerHTML =
    '<div class="card-pad" style="padding-bottom:14px"><div class="card-head" style="margin-bottom:0">' +
    '<div class="card-title">我的班级</div><a class="card-more" href="task-editor.html">＋ 布置新任务</a></div></div>' +
    '<div style="padding:0 24px 24px">' +
    '<div class="card clickable" style="border:1px solid var(--divider)" onclick="location.href=\'class.html\'">' +
    '<div class="card-pad">' +
    '<div class="flex items-center gap-16" style="flex-wrap:wrap">' +
    '<div style="width:52px;height:52px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px">七3</div>' +
    '<div style="flex:1;min-width:200px">' +
    '<div class="weight-600" style="font-size:16px">' + cls.name + '</div>' +
    '<div class="text-xs text-muted mt-4">邀请码 <b class="mono-num">' + cls.inviteCode + '</b> · ' + cls.total + ' 名学生 · 共读《骆驼祥子》</div>' +
    '<div class="flex gap-8 mt-12" style="flex-wrap:wrap">' +
    cls.tasks.map(function (tk) {
      var pct = Math.round(tk.submitted / tk.total * 100);
      return '<span class="tag tag-lg">' + tk.title.slice(0, 12) + '… ' + pct + '%</span>';
    }).join('') +
    '</div></div>' +
    '<div style="text-align:right">' +
    '<div class="text-xs text-muted">平均完成率</div>' +
    '<div style="font-family:var(--serif);font-size:24px;font-weight:700;color:var(--primary)">' +
    Math.round(cls.tasks.reduce(function (a, x) { return a + x.submitted / x.total; }, 0) / cls.tasks.length * 100) + '%</div>' +
    '<a class="btn btn-sm btn-primary mt-8" href="class.html">查看学情 →</a>' +
    '</div></div></div></div></div>';

  /* ---------- 待评阅 ---------- */
  document.getElementById('review-card').innerHTML =
    '<div class="card-pad" style="padding-bottom:14px"><div class="card-head" style="margin-bottom:0">' +
    '<div class="card-title">待评阅 <span class="sub">' + cls.reviews.length + ' 份</span></div>' +
    '<a class="card-more" href="class.html#reviews">全部 →</a></div></div>' +
    '<div style="padding:0 24px 24px">' +
    cls.reviews.map(function (r) {
      return '<div class="list-row">' +
        '<span class="avatar">' + r.stu[0] + '</span>' +
        '<div class="lr-main"><div class="lr-title">' + r.stu + ' · ' + r.task + '</div>' +
        '<div class="lr-sub">' + r.submittedAt + ' 提交</div></div>' +
        '<span class="tag tag-warning">' + r.status + '</span></div>';
    }).join('') + '</div>';

  /* ---------- 快捷操作 ---------- */
  document.getElementById('quick-card').innerHTML =
    '<div class="card-head"><div class="card-title">快捷操作</div></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
    quick('task-editor.html', 'pen', '布置阅读任务', '选书 · 章节 · 截止时间') +
    quick('class.html#charts', 'chart', '查看学情看板', '完成率 · 平均分 · 活跃度') +
    quick('bank.html', 'book', '阅读题库', '系统题 · 校本题 · 收藏题') +
    quick('class.html#reviews', 'note', '作业评阅', '评分 · 评语 · 推荐优秀') +
    '</div>';

  function quick(href, ic, t, d) {
    return '<a class="card clickable" style="padding:14px 16px;border:1px solid var(--divider)" href="' + href + '" onmouseover="this.style.textDecoration=\'none\'">' +
      '<span style="color:var(--primary)">' + UI.icon(ic, 19) + '</span>' +
      '<div class="weight-600 text-sm mt-8">' + t + '</div>' +
      '<div class="text-xs text-muted mt-4">' + d + '</div></a>';
  }

  /* ---------- 消息 ---------- */
  var msgs = [
    { type: '作业', t: '周子墨提交了「思辨题：祥子的第一次买车」', time: '今天 21:04', unread: true },
    { type: '系统', t: '任务「第九章至十六章 · 章节测」将于 10月23日 截止', time: '今天 09:00', unread: true },
    { type: '系统', t: '本周班级周报已生成：活跃 31 人', time: '昨天 18:30', unread: false }
  ];
  document.getElementById('msg-list').innerHTML = msgs.map(function (m) {
    return '<div class="list-row"><span class="tag ' + (m.type === '作业' ? 'tag-accent' : 'tag') + '" style="width:52px;justify-content:center">' + m.type + '</span>' +
      '<div class="lr-main"><div class="lr-title" style="' + (m.unread ? '' : 'color:var(--muted)') + '">' + m.t + '</div>' +
      '<div class="lr-sub">' + m.time + '</div></div>' +
      (m.unread ? '<span class="badge-num">未读</span>' : '') + '</div>';
  }).join('');
})();
</script>
</body>
</html>
