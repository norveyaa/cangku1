<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人成长中心 · 伴读智汇</title>
<link rel="stylesheet" href="../assets/css/base.css">
</head>
<body>
<div class="page">
  <div id="head"></div>

  <!-- 个人信息卡 -->
  <div class="card card-pad" id="profile-card"></div>

  <!-- 统计瓦片 -->
  <div class="stat-grid mt-20" id="stat-grid"></div>

  <!-- 图表行：周阅读 + 能力雷达 -->
  <div style="display:grid;grid-template-columns:1fr 400px;gap:20px;margin-top:20px" class="chart-cols">
    <div class="card card-pad">
      <div class="card-head">
        <div class="card-title">本周阅读时长</div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="text-xs text-muted" id="week-range"></span>
          <a class="card-more" href="report.html">查看阅读周报 →</a>
        </div>
      </div>
      <div id="chart-week"></div>
    </div>
    <div class="card card-pad">
      <div class="card-head">
        <div class="card-title">能力雷达 <span class="sub">满分 100</span></div>
      </div>
      <p class="text-xs text-muted" style="margin:-6px 0 8px">读懂，也在读深</p>
      <div id="chart-radar"></div>
    </div>
  </div>

  <!-- 我的书架 -->
  <div class="card mt-20">
    <div class="card-pad" style="padding-bottom:16px">
      <div class="card-head" style="margin-bottom:14px">
        <div class="card-title">我的书架</div>
        <a class="card-more" href="courses.html">＋ 去书库找下一本</a>
      </div>
      <div class="pill-tabs" id="shelf-tabs">
        <button class="tab active" data-s="reading">在读 <span id="cnt-reading"></span></button>
        <button class="tab" data-s="want">想读 <span id="cnt-want"></span></button>
        <button class="tab" data-s="done">读完 <span id="cnt-done"></span></button>
      </div>
    </div>
    <div style="padding:0 24px 24px" id="shelf-body"></div>
  </div>

  <!-- 笔记 + 成就 -->
  <div style="display:grid;grid-template-columns:1fr 380px;gap:20px;margin-top:20px" class="note-cols">
    <div class="card card-pad">
      <div class="card-head">
        <div class="card-title">把读过的，留下来</div>
        <a class="card-more" href="notes.html">全部笔记与摘抄 →</a>
      </div>
      <div id="notes-list"></div>
    </div>
    <div class="card card-pad">
      <div class="card-head">
        <div class="card-title">阅读正在生根</div>
      </div>
      <div id="ach-list"></div>
      <p class="text-xs text-muted mt-16" style="line-height:1.9">不必和别人比快，<br>只要比昨天多看见一点。</p>
    </div>
  </div>

  <!-- 快捷入口 + 消息 -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:20px" class="grid-4">
    <a class="card card-pad clickable" style="display:block" href="wrongbook.html" onmouseover="this.style.textDecoration='none'">
      <div class="flex items-center gap-12">
        <span style="color:var(--error)">✗</span>
        <div><div class="weight-600" style="font-size:14px">我的错题</div>
        <div class="text-xs text-muted" id="wrong-count">待复习</div></div>
      </div>
    </a>
    <a class="card card-pad clickable" style="display:block" href="#messages" onmouseover="this.style.textDecoration='none'">
      <div class="flex items-center gap-12">
        <span>⭐</span>
        <div><div class="weight-600" style="font-size:14px">我的收藏</div>
        <div class="text-xs text-muted" id="fav-count">条收藏</div></div>
      </div>
    </a>
    <a class="card card-pad clickable" style="display:block" href="#messages" onmouseover="this.style.textDecoration='none'">
      <div class="flex items-center gap-12">
        <span>🔔</span>
        <div><div class="weight-600" style="font-size:14px">消息中心</div>
        <div class="text-xs text-muted" id="msg-count">条未读</div></div>
      </div>
    </a>
    <a class="card card-pad clickable" style="display:block" href="coaching.html" onmouseover="this.style.textDecoration='none'">
      <div class="flex items-center gap-12">
        <span>💬</span>
        <div><div class="weight-600" style="font-size:14px">陪练记录</div>
        <div class="text-xs text-muted" id="coach-count">轮对话已保存</div></div>
      </div>
    </a>
  </div>

  <!-- 消息中心 -->
  <div class="card card-pad mt-20" id="messages">
    <div class="card-head"><div class="card-title">消息中心</div></div>
    <div id="msg-list"></div>
  </div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/charts.js"></script>
<script>
(function () {
  if (!UI.guard('student')) return;
  UI.topbar('profile', { base: '../' });
  var u = Store.user();
  var st = Store.student();
  var book = Store.book('luotuoxiangzi');
  var prog = Store.progressOf('luotuoxiangzi');

  document.getElementById('head').innerHTML = UI.pageHead(
    '个人成长中心',
    '每一页的积累，都会成为你看世界的底气。'
  );

  /* ---------- 个人信息卡 ---------- */
  document.getElementById('profile-card').innerHTML =
    '<div class="flex gap-20 items-center" style="flex-wrap:wrap">' +
    '<div class="avatar" style="width:76px;height:76px;font-size:34px">' + u.name[0] + '</div>' +
    '<div style="flex:1;min-width:240px">' +
    '<div class="flex items-center gap-12" style="flex-wrap:wrap">' +
    '<h2 class="serif" style="font-size:26px">' + u.name + '</h2>' +
    '<span class="tag tag-lg">' + st.grade + '</span>' +
    '<span class="tag tag-lg tag-plain">' + (st.school || '未填写学校') + '</span>' +
    '</div>' +
    '<p class="text-sm text-muted mt-8">名著整本书共读 · 标准阅读计划</p>' +
    '<p class="text-sm text-primary mt-8">不急着翻到最后一页，先听见文字背后的声音。</p>' +
    '</div>' +
    '<div style="width:300px;border:1px solid var(--divider);border-radius:10px;padding:16px 20px">' +
    '<div class="text-xs text-muted">我的阅读目标</div>' +
    '<div class="serif weight-600" style="font-size:18px;margin-top:6px">每日约 30 分钟，读深一点</div>' +
    '<div class="text-xs text-muted mt-12">《骆驼祥子》预计 10月26日 完读</div>' +
    '<a class="text-xs" style="color:var(--link);display:inline-block;margin-top:12px" href="settings.html">编辑资料与目标 →</a>' +
    '</div></div>';

  /* ---------- 统计瓦片 ---------- */
  var week = Store.weekly();
  var tiles = [
    { label: '累计阅读时长', value: UI.fmtMin(st.minutesTotal), note: '共 ' + st.minutesTotal + ' 分钟，慢慢积累', spark: [8, 12, 10, 16, 14, 20, 24] },
    { label: '累计完读书目', value: st.shelf.done.length + ' <small>本</small>', note: '每本书，都是一段新旅程' },
    { label: '连续阅读打卡', value: st.streak + ' <small>天</small>', note: '一周不间断，阅读正在生根', spark: [1, 2, 3, 4, 5, 6, 7] },
    { label: '本周专注阅读', value: week.minutes + ' <small>分钟</small>', note: '比上周多读了 26 分钟', spark: [30, 42, 35, 55, 48, 60, week.minutes], delta: true }
  ];
  document.getElementById('stat-grid').innerHTML = tiles.map(function (t, i) {
    return '<div class="card stat-tile">' +
      '<div class="st-label"><span>' + t.label + '</span><span style="opacity:.7">' + UI.icon(['clock', 'book', 'fire', 'target'][i], 15) + '</span></div>' +
      '<div class="st-value">' + t.value + '</div>' +
      '<div class="flex justify-between items-center" style="margin-top:6px">' +
      '<span class="st-note">' + t.note + '</span>' +
      (t.spark ? '<span id="spark-' + i + '"></span>' : '') +
      '</div></div>';
  }).join('');
  [0, 2, 3].forEach(function (i) {
    var el = document.getElementById('spark-' + i);
    if (el) Charts.spark(el, tiles[i].spark);
  });

  /* ---------- 图表 ---------- */
  document.getElementById('week-range').textContent = week.range + ' · 本周已读 ' + week.minutes + ' 分钟';
  Charts.bar(document.getElementById('chart-week'), {
    data: week.days.map(function (d, i) { return { label: d, value: week.week[i] }; }),
    target: 30, unit: '分钟', height: 240,
    aria: '本周每日阅读时长柱状图'
  });
  Charts.radar(document.getElementById('chart-radar'), {
    dims: Object.keys(st.ability).map(function (k) { return { label: k, value: st.ability[k] }; }),
    size: 300, aria: '阅读能力四维雷达图'
  });

  /* ---------- 书架 ---------- */
  var shelf = st.shelf;
  document.getElementById('cnt-reading').textContent = shelf.reading.length;
  document.getElementById('cnt-want').textContent = shelf.want.length;
  document.getElementById('cnt-done').textContent = shelf.done.length;
  function shelfBookCard(b, mode) {
    var p = Store.progressOf(b.id);
    return '<div class="card clickable" style="overflow:hidden;border:1px solid var(--divider)" onclick="location.href=\'course-detail.html?id=' + b.id + '\'">' +
      '<div style="display:flex;gap:14px;padding:16px;align-items:flex-start">' +
      '<img src="../' + Store.bookCover(b) + '" alt="' + b.title + '" style="width:64px;height:90px;border-radius:5px;box-shadow:var(--shadow-sm);object-fit:cover">' +
      '<div style="flex:1;min-width:0">' +
      '<div class="serif weight-600" style="font-size:15.5px">' + b.title + '</div>' +
      '<div class="text-xs text-muted" style="margin-top:2px">' + b.author + ' 著</div>' +
      (mode === 'reading'
        ? '<div class="mt-12"><div class="progress thin"><i style="width:' + p.pct + '%"></i></div>' +
          '<div class="progress-label"><span>' + p.chapter + ' / ' + p.total + ' 章</span><span>' + p.pct + '%</span></div>' +
          '<a class="text-xs" style="color:var(--link)" href="reader.html?book=' + b.id + '&ch=' + Math.min(p.chapter, p.total - 1) + '">继续阅读 →</a></div>'
        : mode === 'want'
          ? '<div class="mt-12 text-xs text-muted">' + b.words + ' · ' + b.genre + '</div>'
          : '<div class="mt-12"><span class="tag tag-success">已读完</span></div>') +
      '</div></div></div>';
  }
  function renderShelf(mode) {
    var ids = mode === 'reading' ? shelf.reading.map(function (r) { return r[0]; }) : shelf[mode];
    var body = document.getElementById('shelf-body');
    if (!ids.length) {
      body.innerHTML = UI.empty('book', mode === 'reading' ? '还没有在读的书' : mode === 'want' ? '想读列表是空的' : '还没有读完的书',
        '去书库挑一本喜欢的吧', '<a class="btn btn-primary" href="courses.html">去书库</a>');
      return;
    }
    body.innerHTML = '<div class="grid grid-3">' + ids.map(function (id) {
      return shelfBookCard(Store.book(id), mode);
    }).join('') + '</div>';
  }
  document.querySelectorAll('#shelf-tabs .tab').forEach(function (t) {
    t.onclick = function () {
      document.querySelectorAll('#shelf-tabs .tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      renderShelf(t.dataset.s);
    };
  });
  renderShelf('reading');

  /* ---------- 笔记 ---------- */
  var notes = Store.notes();
  document.getElementById('notes-list').innerHTML = notes.length
    ? notes.slice(0, 3).map(function (n) {
      var b = Store.book(n.bookId);
      return '<div class="list-row clickable" onclick="location.href=\'notes.html\'">' +
        '<span style="width:34px;height:34px;border-radius:8px;background:var(--primary-weak);display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0">' + UI.icon('note', 16) + '</span>' +
        '<div class="lr-main"><div class="lr-title">' + n.text + '</div>' +
        '<div class="lr-sub">' + b.title + ' · ' + n.chapterTitle + (n.quote ? ' · ' + n.quote : '') + '</div></div>' +
        '<span class="text-xs text-muted">' + n.date.slice(5) + '</span></div>';
    }).join('')
    : UI.empty('note', '还没有笔记', '阅读时选中文字即可划线、批注、摘抄');

  /* ---------- 成就 ---------- */
  document.getElementById('ach-list').innerHTML = st.achievements.map(function (a) {
    return '<div class="list-row">' +
      '<span style="width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;' +
      (a.got ? 'background:rgba(241,180,100,.25)' : 'background:var(--bg-deep);filter:grayscale(1);opacity:.6') + '">🏅</span>' +
      '<div class="lr-main"><div class="lr-title" style="' + (a.got ? '' : 'color:var(--muted)') + '">' + a.name + '</div>' +
      '<div class="lr-sub">' + a.desc + (a.got ? ' · 已点亮' : ' · ' + a.progress + ' / ' + a.total) + '</div></div>' +
      (a.got ? '<span class="tag tag-accent">已点亮</span>' : '<span class="tag tag-plain">进行中</span>') +
      '</div>';
  }).join('');

  /* ---------- 快捷入口计数 ---------- */
  var wrong = Store.wrongList();
  document.getElementById('wrong-count').textContent = wrong.length + ' 道待复习';
  document.getElementById('fav-count').textContent = Store.favorites().length + ' 条收藏';
  var unread = st.messages.filter(function (m) { return !m.read; }).length;
  document.getElementById('msg-count').textContent = unread + ' 条未读';
  document.getElementById('coach-count').textContent = Store.coachLog().length + ' 轮对话已保存';

  /* ---------- 消息中心 ---------- */
  document.getElementById('msg-list').innerHTML = st.messages.map(function (m) {
    var tag = m.type === '任务' ? 'tag-blue' : m.type === '评价' ? 'tag-accent' : 'tag';
    return '<div class="list-row"><span class="tag ' + tag + '" style="width:56px;justify-content:center">' + m.type + '</span>' +
      '<div class="lr-main"><div class="lr-title" style="' + (m.read ? 'color:var(--muted)' : '') + '">' + m.title + '</div>' +
      '<div class="lr-sub">' + m.time + '</div></div>' +
      (m.read ? '' : '<span class="badge-num">未读</span>') + '</div>';
  }).join('');
})();
</script>
</body>
</html>
