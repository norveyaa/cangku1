<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习报告 · 伴读智汇</title>
<link rel="stylesheet" href="../assets/css/base.css">
</head>
<body>
<div class="page" style="max-width:960px">
  <div id="head"></div>
  <div id="main"></div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/charts.js"></script>
<script>
(function () {
  if (!UI.guard('student')) return;
  UI.topbar('profile', { base: '../' });
  var st = Store.student();
  var week = Store.weekly();

  document.getElementById('head').innerHTML = UI.pageHead('阅读周报 · ' + week.range, '本周已读 ' + week.minutes + ' 分钟 · 每日目标 ' + week.target + ' 分钟') +
    '<div style="display:flex;gap:12px;margin-top:-12px;margin-bottom:20px">' +
    '<button class="btn btn-sm btn-outline" onclick="UI.toast(\'周报已导出（演示）\',\'success\')">导出报告</button>' +
    '<button class="btn btn-sm btn-ghost" onclick="UI.toast(\'已分享给家长（演示）\',\'success\')">分享给家长</button></div>';

  document.getElementById('main').innerHTML =
    '<div class="card card-pad">' +
    '<div class="card-head"><div class="card-title">本周阅读时长</div></div>' +
    '<div id="chart-week"></div></div>' +

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px" class="grid-2">' +
    '<div class="card card-pad">' +
    '<div class="card-head"><div class="card-title">能力雷达 <span class="sub">与上周对比</span></div></div>' +
    '<div id="chart-radar"></div></div>' +
    '<div class="card card-pad">' +
    '<div class="card-head"><div class="card-title">在读书目进度</div></div>' +
    '<div id="book-progress"></div>' +
    '<div class="divider-line"></div>' +
    '<div class="card-head" style="margin-bottom:8px"><div class="card-title">坚持度</div></div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap" id="streak-dots"></div>' +
    '<p class="text-xs text-muted mt-12">连续阅读 ' + week.streak + ' 天 · 今天已打卡</p>' +
    '</div></div>' +

    '<div class="card card-pad mt-20" style="background:linear-gradient(135deg,rgba(31,58,95,.04),rgba(31,58,95,.01))">' +
    '<div class="card-head"><div class="card-title">' + UI.icon('spark', 17) + '本周 AI 小结</div></div>' +
    '<div class="text-sm" style="line-height:2.1">' +
    '<p>① <b>投入度</b>：本周专注阅读 ' + week.minutes + ' 分钟，周一与周三表现突出。周末还未开卷，可以从 10 分钟开始，不必强求一次读很多。</p>' +
    '<p>② <b>理解度与思辨力</b>：本周完成的思辨题中，你已经开始引用文本证据——这是"读深"的关键一步。建议下次尝试<b>反驳自己的观点</b>，再补一个反例。</p>' +
    '<p>③ <b>下周建议</b>：继续《骆驼祥子》第十六至十八章；每日任务已为你安排 1 道思辨题 + 1 篇同主题拓展（<b>频次控制：每日不超过 3—5 题</b>，不打断阅读）。</p>' +
    '</div></div>';

  Charts.bar(document.getElementById('chart-week'), {
    data: week.days.map(function (d, i) { return { label: d, value: week.week[i] }; }),
    target: 30, unit: '分钟', height: 240,
    aria: '本周每日阅读时长柱状图'
  });
  Charts.radar(document.getElementById('chart-radar'), {
    dims: Object.keys(st.ability).map(function (k) { return { label: k, value: st.ability[k] }; }),
    size: 260, aria: '能力雷达图'
  });

  document.getElementById('book-progress').innerHTML = week.books.map(function (b) {
    var book = Store.book(b.id);
    return '<div style="margin-bottom:14px">' +
      '<div class="flex justify-between text-sm" style="margin-bottom:5px"><span class="weight-600">《' + book.title + '》</span><span class="text-muted mono-num">' + b.pct + '%</span></div>' +
      '<div class="progress"><i style="width:' + b.pct + '%"></i></div></div>';
  }).join('');

  // 打卡日历（最近 14 天）
  var dots = '';
  for (var i = 13; i >= 0; i--) {
    var on = i >= 14 - week.streak;
    dots += '<div title="' + (14 - i) + ' 天前" style="width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;' +
      (on ? 'background:var(--success);color:#fff' : 'background:var(--bg-deep);color:var(--muted)') + '">' +
      (on ? '✓' : '·') + '</div>';
  }
  document.getElementById('streak-dots').innerHTML = dots;
})();
</script>
</body>
</html>
