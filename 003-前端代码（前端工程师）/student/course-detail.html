<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程详情 · 伴读智汇</title>
<link rel="stylesheet" href="../assets/css/base.css">
</head>
<body>
<div class="page" id="app">
  <div id="head"></div>
  <div id="main"></div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(function () {
  if (!UI.guard('student')) return;
  UI.topbar('courses', { base: '../' });
  var id = new URLSearchParams(location.search).get('id') || 'luotuoxiangzi';
  var b = Store.book(id);
  if (!b) { document.getElementById('main').innerHTML = UI.empty('book', '书目不存在', '换个书目试试', '<a class="btn btn-outline" href="courses.html">返回课程</a>'); return; }
  document.title = b.title + ' · 伴读智汇';
  var prog = Store.progressOf(id);
  var shelf = Store.shelfStatus(id);
  var readList = Store.chapterReadList(id);

  var joinBtn = shelf === 'none'
    ? '<button class="btn btn-primary btn-lg" id="join-btn">' + UI.icon('plus', 17) + '加入课程</button>'
    : (prog.pct === 100
      ? '<a class="btn btn-success btn-lg" href="reader.html?book=' + id + '&ch=0">' + UI.icon('book', 17) + '重新阅读</a>'
      : '<a class="btn btn-primary btn-lg" href="reader.html?book=' + id + '&ch=' + (prog.chapter < prog.total ? prog.chapter : prog.total - 1) + '">' + UI.icon('book', 17) + (prog.chapter > 0 ? '继续阅读' : '开始阅读') + '</a>');

  var tasksHtml = [
    { n: '① 导读任务', d: '作者生平、时代背景与阅读策略', done: readList.length >= 1 },
    { n: '② 章节任务', d: '章节测 · 人物分析 · 情节梳理', done: readList.length >= 8 },
    { n: '③ 思辨题', d: '观点辨析 · 因果分析 · 现实迁移（需引用文本证据）', done: false },
    { n: '④ 拓展任务', d: '同主题文本 · 评论文章 · 影视片段', done: false },
    { n: '⑤ 读后感', d: '支持草稿、提交、AI 反馈与教师评阅', done: false }
  ].map(function (t) {
    return '<div class="list-row"><span class="tag ' + (t.done ? 'tag-success' : 'tag-warning') + '" style="width:110px;justify-content:center">' + (t.done ? '已完成' : '待完成') + '</span>' +
      '<div class="lr-main"><div class="lr-title">' + t.n + '：' + t.d + '</div></div>' +
      '<a class="btn btn-sm btn-outline" href="tasks.html?book=' + id + '">查看</a></div>';
  }).join('');

  var discussions = [
    { u: '周子墨', t: '祥子第三次买车时，我觉得作者早就埋好了伏笔……', r: 8, hot: true },
    { u: '陈老师', t: '【置顶】思辨题提交前自查：你引用的文本证据能支撑观点吗？', r: 15, hot: true, pinned: true },
    { u: '陈雨桐', t: '读到第五章"希望是件危险的事"，大家怎么看？', r: 5 }
  ].map(function (d) {
    return '<div class="list-row">' +
      '<span class="avatar">' + d.u[0] + '</span>' +
      '<div class="lr-main"><div class="lr-title">' + d.t + (d.pinned ? ' <span class="tag tag-accent" style="margin-left:6px">置顶</span>' : '') + '</div>' +
      '<div class="lr-sub">' + d.u + ' · ' + d.r + ' 条回复</div></div>' +
      (d.hot ? '<span class="tag tag-error">热</span>' : '') +
      '</div>';
  }).join('');

  document.getElementById('head').innerHTML = UI.pageHead(b.title, b.author + ' 著 · ' + b.era + ' · ' + b.nation + ' · ' + b.stage + '必读');
  document.getElementById('main').innerHTML =
    '<div class="card" style="overflow:hidden">' +
    '<div style="display:flex;gap:28px;padding:28px;flex-wrap:wrap">' +
    '<img src="../' + Store.bookCover(b) + '" alt="' + b.title + '" style="width:148px;height:208px;border-radius:8px;box-shadow:var(--shadow-md)">' +
    '<div style="flex:1;min-width:300px">' +
    '<div class="flex items-center gap-12" style="flex-wrap:wrap">' +
    '<h2 class="serif" style="font-size:24px">' + b.title + '</h2>' +
    '<span class="tag">' + b.genre + '</span>' +
    '<span class="tag tag-blue">' + b.stage + '</span>' +
    '<span class="tag tag-green">' + b.difficulty + '</span>' +
    '</div>' +
    '<p class="text-muted text-sm mt-8">' + b.author + ' 著 · ' + b.era + ' · ' + b.words + ' · 预计阅读 ' + Math.round(parseInt(b.minutes) / 60) + ' 小时 · 共 ' + b.chapterNames.length + ' 章</p>' +
    '<p class="mt-16" style="line-height:1.9">' + b.intro + '</p>' +
    '<div class="flex gap-12 mt-16" style="flex-wrap:wrap">' +
    b.themes.map(function (t) { return '<span class="tag tag-lg"># ' + t + '</span>'; }).join('') +
    '</div>' +
    '<div class="flex gap-12 mt-20" style="flex-wrap:wrap">' + joinBtn +
    (shelf !== 'none' ? '<button class="btn btn-outline btn-lg" id="quit-btn">移出书架</button>' : '') +
    (shelf === 'none' ? '<button class="btn btn-ghost btn-lg" id="want-btn">' + UI.icon('bookmark', 15) + '想读</button>' : '') +
    '</div>' +
    '</div>' +
    '<div style="width:260px;background:var(--bg);border-radius:12px;padding:20px 22px;align-self:stretch">' +
    '<div class="text-xs text-muted">整本进度</div>' +
    '<div style="font-family:var(--serif);font-size:30px;font-weight:600;color:var(--primary);margin:4px 0 10px">' + prog.pct + '%</div>' +
    '<div class="progress"><i style="width:' + prog.pct + '%"></i></div>' +
    '<div class="progress-label"><span>' + prog.chapter + ' / ' + prog.total + ' 章</span><span>' + (prog.pct === 100 ? '已完读' : '进行中') + '</span></div>' +
    '<div class="divider-line" style="margin:16px 0"></div>' +
    '<div class="text-xs text-muted">阅读目标</div>' +
    '<div class="serif weight-600" style="font-size:15px;margin-top:4px;line-height:1.7">' + b.coreThemes[0] + '</div>' +
    '<div class="text-xs text-muted mt-12">思辨方向</div>' +
    '<div class="text-sm mt-4" style="line-height:1.7">' + b.thinkDir + '</div>' +
    '</div>' +
    '</div></div>';

  // 目录 + 任务 + 讨论
  document.getElementById('main').insertAdjacentHTML('beforeend',
    '<div style="display:grid;grid-template-columns:1fr 340px;gap:20px;margin-top:20px" class="detail-cols">' +
    '<div>' +
    '<div class="card"><div class="card-pad">' +
    '<div class="card-head"><div class="card-title">目录 <span class="sub">已读 ' + readList.length + ' / ' + b.chapterNames.length + ' 章</span></div></div>' +
    '<div id="toc-list" style="max-height:340px;overflow:auto">' +
    b.chapterNames.slice(0, 14).map(function (t, i) {
      var read = readList.indexOf(i) >= 0;
      return '<div class="list-row clickable" onclick="location.href=\'reader.html?book=' + id + '&ch=' + i + '\'">' +
        '<span class="' + (read ? 'text-success' : 'text-muted') + '">' + (read ? UI.icon('check', 16) : UI.icon('book', 16)) + '</span>' +
        '<div class="lr-main"><div class="lr-title">' + t + '</div></div>' +
        '<span class="text-xs text-muted">' + (read ? '已读' : '未读') + '</span></div>';
    }).join('') +
    (b.chapterNames.length > 14 ? '<div class="text-center text-xs text-muted" style="padding:10px 0 2px">… 共 ' + b.chapterNames.length + ' 章，打开阅读器查看全部</div>' : '') +
    '</div></div></div>' +
    '<div class="card mt-20"><div class="card-pad">' +
    '<div class="card-head"><div class="card-title">任务列表 <span class="sub">随阅读进度解锁</span></div></div>' + tasksHtml +
    '</div></div></div>' +
    '<div>' +
    '<div class="card"><div class="card-pad">' +
    '<div class="card-head"><div class="card-title">讨论区 <span class="sub">班级共读</span></div>' +
    '<a class="card-more" href="coaching.html">参与讨论 →</a></div>' + discussions +
    '<div class="flex gap-8 mt-16"><input class="input" id="disc-input" placeholder="说说你的想法…" style="flex:1">' +
    '<button class="btn btn-primary" onclick="UI.postDisc()">发布</button></div>' +
    '</div></div></div>' +
    '</div>');

  var join = document.getElementById('join-btn');
  if (join) join.onclick = function () {
    Store.addToShelf(id, 'reading');
    UI.toast('已加入课程，开始你的阅读计划吧', 'success');
    setTimeout(function () { location.reload(); }, 500);
  };
  var quit = document.getElementById('quit-btn');
  if (quit) quit.onclick = function () {
    UI.confirmAct('从书架移除《' + b.title + '》？阅读进度将被保留。', function () {
      Store.addToShelf(id, 'none');
      location.reload();
    });
  };
  var want = document.getElementById('want-btn');
  if (want) want.onclick = function () {
    Store.addToShelf(id, 'want');
    UI.toast('已加入书架（想读）', 'success');
    setTimeout(function () { location.reload(); }, 400);
  };

  window.UI = Object.assign(window.UI || {}, {
    postDisc: function () {
      var v = document.getElementById('disc-input').value.trim();
      if (!v) { UI.toast('先写点什么吧', 'warning'); return; }
      UI.toast('已发布到班级讨论区（演示）', 'success');
      document.getElementById('disc-input').value = '';
    }
  });
})();
</script>
</body>
</html>
